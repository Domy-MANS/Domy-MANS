<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 971.74 48" preserveAspectRatio="none" width="971.74" height="48" role="img" aria-label="insect-frass-vision overview: insects and frass are segmented from a camera view, a serpentine suction path is planned, written to a Siemens S7 PLC, and the insects are picked up along the path.">
<style>.sans{font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect x=".5" y=".5" width="1199" height="359" rx="14" fill="#0b0f17" stroke="#263041"/>
<rect x="58" y="30" width="52" height="5" rx="2.5" fill="#ffd23f"/>
<text x="58" y="86" class="sans" font-size="44" font-weight="700" fill="#eef2f8">insect-frass-vision</text>
<text x="58" y="124" class="sans" font-size="21" fill="#ffd23f">Vision-guided insect and frass separation</text>
<rect x="974" y="48.0" width="186" height="44" rx="22.0" fill="#ffd23f"/><text x="996" y="76.7" class="sans" font-size="19" font-weight="600" fill="#0b0f17">Watch demo</text><path d="M1126 76.0L1138 64.0M1128 64.0H1138V74.0" fill="none" stroke="#0b0f17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="176" class="sans" font-size="21" fill="#9aa7ba">Insects cluster on their own. A camera and YOLO11n-seg</text><text x="58" y="207" class="sans" font-size="21" fill="#9aa7ba">find them, a suction path is planned through each cluster,</text><text x="58" y="238" class="sans" font-size="21" fill="#9aa7ba">and a Siemens S7 PLC drives the machine to pick them up.</text>
