<text x="58" y="124" class="sans" font-size="21" fill="#60a5fa">Adjustable powered elbow-worn exoskeleton</text>
<rect x="974" y="48.0" width="186" height="44" rx="22.0" fill="#60a5fa"/><text x="996" y="76.7" class="sans" font-size="19" font-weight="600" fill="#0b0f17">Watch video</text><path d="M1126 76.0L1138 64.0M1128 64.0H1138V74.0" fill="none" stroke="#0b0f17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="176" class="sans" font-size="21" fill="#9aa7ba">A wearable elbow joint: my own 24 V motor driver board,</text><text x="58" y="207" class="sans" font-size="21" fill="#9aa7ba">3D-printed adjustable links, and a 100 Hz position and</text><text x="58" y="238" class="sans" font-size="21" fill="#9aa7ba">speed PID loop that follows a smooth motion curve.</text>
